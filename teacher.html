<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>2-9 학급 알림판 관리자</title>

<style>

body{
    margin:0;
    padding:20px;
    background:#eef5ff;
    font-family:'Segoe UI',sans-serif;
}

.container{
    max-width:1000px;
    margin:auto;
}

.card{
    background:white;
    border-radius:20px;
    padding:20px;
    margin-bottom:15px;
    box-shadow:0 4px 12px rgba(0,0,0,.1);
}

h1{
    color:#2563eb;
}

.request-box{
    font-size:30px;
    font-weight:bold;
    text-align:center;
    min-height:80px;
}

input,
textarea{
    width:100%;
    box-sizing:border-box;
    padding:15px;
    margin-top:10px;
    margin-bottom:10px;
    border-radius:10px;
    border:1px solid #ccc;
    font-size:20px;
}

textarea{
    height:120px;
}

.btn{
    background:#2563eb;
    color:white;
    border:none;
    border-radius:12px;
    padding:12px 18px;
    margin:5px;
    cursor:pointer;
    font-size:18px;
}

.btn:hover{
    background:#1d4ed8;
}

.big{
    width:100%;
    font-size:22px;
}

</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>📢 학생 요청</h1>

<div id="studentRequest" class="request-box">
현재 없음
</div>

<br>

<button
class="btn big"
onclick="clearStudentRequest()">
✅ 요청 확인
</button>

</div>

<div class="card">

<h1>👨‍🏫 학생 호출</h1>

<input
id="student"
placeholder="학생 이름">

<textarea
id="message"
placeholder="메시지 입력"></textarea>

<div>

<button class="btn"
onclick="quick('즉시 교무실로 오세요')">
즉시
</button>

<button class="btn"
onclick="quick('1교시 끝나고 오세요')">
1교시 후
</button>

<button class="btn"
onclick="quick('2교시 끝나고 오세요')">
2교시 후
</button>

<button class="btn"
onclick="quick('3교시 끝나고 오세요')">
3교시 후
</button>

<button class="btn"
onclick="quick('점심시간에 오세요')">
점심
</button>

<button class="btn"
onclick="quick('방과후에 오세요')">
방과후
</button>

</div>

<button
class="btn big"
onclick="sendMessage()">
🚨 학생 호출
</button>

<button
class="btn big"
onclick="resetBoard()">
✅ 대기중으로 변경
</button>

</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";

import {
getFirestore,
doc,
updateDoc,
collection,
addDoc,
onSnapshot
}
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDB9TqH8CHoKs1XQb3Jg9ecmyNq4N2VDTA",
  authDomain: "classcall-d0954.firebaseapp.com",
  projectId: "classcall-d0954",
  storageBucket: "classcall-d0954.firebasestorage.app",
  messagingSenderId: "721726711585",
  appId: "1:721726711585:web:e69bbc715caf82baa88060"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* 학생 요청 실시간 표시 */

onSnapshot(
doc(db,"teacherRequest","current"),
(snapshot)=>{

const data=snapshot.data();

if(!data) return;

document.getElementById(
"studentRequest"
).innerHTML =
data.message || "현재 없음";

}
);

/* 빠른 버튼 */

window.quick = function(text){

document.getElementById("message").value=text;

};

/* 학생 호출 */

window.sendMessage =
async function(){

const student =
document.getElementById("student").value;

const message =
document.getElementById("message").value;

if(!student){

alert("학생 이름 입력");

return;

}

if(!message){

alert("메시지 입력");

return;

}

const text =
`🚨

${student} 학생

${message}`;

await updateDoc(
doc(db,"call","current"),
{
message:text
}
);

await addDoc(
collection(db,"history"),
{
message:text
}
);

alert("전송 완료");

setTimeout(async()=>{

await updateDoc(
doc(db,"call","current"),
{
message:"대기중"
}
);

},60000);

};

/* 대기중 */

window.resetBoard =
async function(){

await updateDoc(
doc(db,"call","current"),
{
message:"대기중"
}
);

};

/* 학생 요청 확인 */

window.clearStudentRequest =
async function(){

await updateDoc(
doc(db,"teacherRequest","current"),
{
message:"현재 없음"
}
);

};

</script>

</body>
</html>
