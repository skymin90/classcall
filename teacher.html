<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2-9 학급 알림판 관리자</title>

<style>
body{
    margin:0;
    padding:25px;
    font-family:'Segoe UI',sans-serif;
    background:#eef5ff;
}

.container{
    max-width:900px;
    margin:auto;
}

.card{
    background:white;
    border-radius:20px;
    padding:20px;
    margin-bottom:15px;
    box-shadow:0 4px 12px rgba(0,0,0,.1);
}

h1{
    color:#2563eb;
}

input,
textarea{
    width:100%;
    box-sizing:border-box;
    padding:15px;
    margin-top:10px;
    margin-bottom:10px;
    font-size:20px;
    border:1px solid #ccc;
    border-radius:10px;
}

textarea{
    height:120px;
}

.button-row{
    margin-top:10px;
    margin-bottom:15px;
}

.btn{
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    padding:12px 18px;
    margin:5px;
    font-size:18px;
    cursor:pointer;
}

.btn:hover{
    background:#1d4ed8;
}

.big{
    width:100%;
    font-size:22px;
    margin-top:10px;
}

</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>👨‍🏫 2-9 학급 알림판 관리자</h1>

<input
id="student"
placeholder="학생 이름 입력">

<textarea
id="message"
placeholder="전달할 메시지를 입력하세요"></textarea>

<div class="button-row">

<button class="btn" onclick="quick('즉시 교무실로 오세요')">
즉시
</button>

<button class="btn" onclick="quick('1교시 끝나고 오세요')">
1교시 후
</button>

<button class="btn" onclick="quick('2교시 끝나고 오세요')">
2교시 후
</button>

<button class="btn" onclick="quick('3교시 끝나고 오세요')">
3교시 후
</button>

<button class="btn" onclick="quick('점심시간에 오세요')">
점심시간
</button>

<button class="btn" onclick="quick('방과후에 오세요')">
방과후
</button>

</div>

<button
class="btn big"
onclick="sendMessage()">
🚨 학생 호출
</button>

<button
class="btn big"
onclick="resetBoard()">
✅ 대기중으로 변경
</button>

</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";

import {
getFirestore,
doc,
updateDoc,
collection,
addDoc
}
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDB9TqH8CHoKs1XQb3Jg9ecmyNq4N2VDTA",
  authDomain: "classcall-d0954.firebaseapp.com",
  projectId: "classcall-d0954",
  storageBucket: "classcall-d0954.firebasestorage.app",
  messagingSenderId: "721726711585",
  appId: "1:721726711585:web:e69bbc715caf82baa88060"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.quick = function(text){

document.getElementById("message").value = text;

};

window.sendMessage = async function(){

const student =
document.getElementById("student").value;

const message =
document.getElementById("message").value;

if(!student){
alert("학생 이름을 입력하세요.");
return;
}

if(!message){
alert("메시지를 입력하세요.");
return;
}

const text = `🚨

${student} 학생

${message}`;

await updateDoc(
doc(db,"call","current"),
{
message:text
}
);

await addDoc(
collection(db,"history"),
{
message:text,
time:new Date().toLocaleString("ko-KR")
}
);

alert("전송 완료");

setTimeout(async ()=>{

await updateDoc(
doc(db,"call","current"),
{
message:"대기중"
}
);

},60000);

};

window.resetBoard = async function(){

await updateDoc(
doc(db,"call","current"),
{
message:"대기중"
}
);

};

</script>

</body>
</html>
