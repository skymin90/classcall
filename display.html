<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>2-9 학급 알림판</title>

<style>

body{
    margin:0;
    padding:20px;
    background:#eef5ff;
    font-family:'Segoe UI',sans-serif;
}

.container{
    max-width:1200px;
    margin:auto;
}

.card{
    background:white;
    border-radius:20px;
    padding:20px;
    margin-bottom:15px;
    box-shadow:0 4px 12px rgba(0,0,0,.1);
}

.title{
    text-align:center;
    color:#2563eb;
    font-size:42px;
    font-weight:bold;
}

#message{
    text-align:center;
    font-size:50px;
    font-weight:bold;
    min-height:120px;
}

#clock{
    text-align:center;
    font-size:32px;
    font-weight:bold;
}

.flash{
    animation:blink .5s infinite;
}

@keyframes blink{
    0%{background:white;}
    50%{background:#ffd6d6;}
    100%{background:white;}
}

.number-grid{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:10px;
}

.number-btn{
    padding:15px;
    border:none;
    border-radius:15px;
    cursor:pointer;
    font-size:24px;
    font-weight:bold;
    background:#dbeafe;
    color:#1d4ed8;
}

.number-btn.selected{
    background:#2563eb;
    color:white;
}

.reason-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
    margin-top:20px;
}

.reason-btn{
    border:none;
    border-radius:15px;
    cursor:pointer;
    padding:20px;
    font-size:26px;
    background:#eff6ff;
}

.reason-btn:hover{
    background:#dbeafe;
}

#selected{
    text-align:center;
    font-size:28px;
    font-weight:bold;
    margin-bottom:15px;
}

#history{
    font-size:18px;
    line-height:1.8;
}

</style>
</head>

<body>

<div class="container">

<div class="card">
<div class="title">🏫 2-9 학급 알림판</div>
</div>

<div class="card">
<h2>📢 현재 알림</h2>
<div id="message">대기중</div>
</div>

<div class="card">
<h2>🕒 현재 시간</h2>
<div id="clock"></div>
</div>

<div class="card">

<h2>👨‍🏫 선생님 호출</h2>

<div id="selected">
출석번호를 선택하세요
</div>

<div id="numberGrid" class="number-grid"></div>

<div class="reason-grid">

<button
class="reason-btn"
onclick="sendRequest('질문')">
❓ 질문
</button>

<button
class="reason-btn"
onclick="sendRequest('상담')">
💬 상담
</button>

<button
class="reason-btn"
onclick="sendRequest('급함')">
🚨 급함
</button>

<button
class="reason-btn"
onclick="sendRequest('기타')">
📝 기타
</button>

</div>

</div>

<div class="card">

<h2>📋 최근 학생 요청</h2>

<div id="history">
불러오는 중...
</div>

</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";

import {
getFirestore,
doc,
onSnapshot,
collection,
addDoc,
getDocs
}
from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDB9TqH8CHoKs1XQb3Jg9ecmyNq4N2VDTA",
  authDomain: "classcall-d0954.firebaseapp.com",
  projectId: "classcall-d0954",
  storageBucket: "classcall-d0954.firebasestorage.app",
  messagingSenderId: "721726711585",
  appId: "1:721726711585:web:e69bbc715caf82baa88060"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let selectedNumber = null;
let oldMsg="";

/* 현재 알림 */

onSnapshot(
doc(db,"call","current"),
(snapshot)=>{

const data=snapshot.data();

if(!data) return;

const msg=data.message || "대기중";

document.getElementById("message").innerHTML =
msg.replace(/\n/g,"<br>");

if(msg!==oldMsg && msg!=="대기중"){

document.body.classList.add("flash");

setTimeout(()=>{
document.body.classList.remove("flash");
},10000);

}

oldMsg=msg;

}
);

/* 번호 버튼 생성 */

const grid =
document.getElementById("numberGrid");

for(let i=1;i<=33;i++){

const btn =
document.createElement("button");

btn.className="number-btn";

btn.innerText=i;

btn.onclick=()=>{

selectedNumber=i;

document
.querySelectorAll(".number-btn")
.forEach(x=>x.classList.remove("selected"));

btn.classList.add("selected");

document.getElementById("selected").innerHTML =
`✅ ${i}번 학생`;

};

grid.appendChild(btn);

}

/* 학생 요청 저장 */

window.sendRequest =
async function(reason){

if(!selectedNumber){

alert("출석번호를 선택하세요.");

return;

}

const text =
`${selectedNumber}번 학생 ${reason} 요청`;

await addDoc(
collection(db,"teacherRequest"),
{
number:selectedNumber,
reason:reason,
message:text,
time:new Date().toLocaleTimeString("ko-KR"),
status:"new"
}
);

alert("요청이 전송되었습니다.");

};

/* 최근 요청 */

async function loadHistory(){

const snap =
await getDocs(
collection(db,"teacherRequest")
);

let arr=[];

snap.forEach((d)=>{

if(d.id==="current") return;

arr.push(d.data());

});

arr.reverse();

arr = arr.slice(0,5);

document.getElementById("history").innerHTML =

arr.length
? arr.map(x =>
`• ${x.message}<br>🕒 ${x.time}`
).join("<br><br>")
: "최근 요청 없음";

}

loadHistory();

setInterval(loadHistory,5000);

/* 시계 */

setInterval(()=>{

document.getElementById("clock").innerText =
new Date().toLocaleTimeString("ko-KR");

},1000);

</script>

</body>
</html>
