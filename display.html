<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2-9 학급 알림판</title>

<style>
body{
    margin:0;
    padding:20px;
    background:#eef5ff;
    font-family:'Segoe UI',sans-serif;
}

.container{
    max-width:1100px;
    margin:auto;
}

.card{
    background:white;
    border-radius:20px;
    padding:20px;
    margin-bottom:15px;
    box-shadow:0 4px 12px rgba(0,0,0,.1);
}

.title{
    text-align:center;
    color:#2563eb;
    font-size:42px;
    font-weight:bold;
}

#message{
    text-align:center;
    font-size:52px;
    font-weight:bold;
    min-height:120px;
}

#clock{
    text-align:center;
    font-size:32px;
    font-weight:bold;
}

.btn{
    width:100%;
    padding:18px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    background:#2563eb;
    color:white;
    font-size:24px;
}

.btn:hover{
    background:#1d4ed8;
}

#history{
    font-size:18px;
    line-height:1.8;
}

.flash{
    animation:blink .5s infinite;
}

@keyframes blink{
    0%{background:white;}
    50%{background:#ffcccc;}
    100%{background:white;}
}
</style>
</head>

<body>

<div class="container">

<div class="card">
<div class="title">🏫 2-9 학급 알림판</div>
</div>

<div class="card">
<h2>📢 현재 알림</h2>
<div id="message">대기중</div>
</div>

<div class="card">
<h2>🕒 현재 시간</h2>
<div id="clock"></div>
</div>

<div class="card">
<button class="btn" onclick="teacherCall()">
👨‍🏫 선생님 호출
</button>
</div>

<div class="card">
<h2>📋 최근 알림</h2>
<div id="history">
최근 알림 없음
</div>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";

import {
getFirestore,
doc,
onSnapshot,
collection,
getDocs,
updateDoc,
addDoc
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDB9TqH8CHoKs1XQb3Jg9ecmyNq4N2VDTA",
  authDomain: "classcall-d0954.firebaseapp.com",
  projectId: "classcall-d0954",
  storageBucket: "classcall-d0954.firebasestorage.app",
  messagingSenderId: "721726711585",
  appId: "1:721726711585:web:e69bbc715caf82baa88060"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let oldMsg="";

onSnapshot(
doc(db,"call","current"),
(snapshot)=>{

const data=snapshot.data();

if(!data) return;

const msg=data.message || "대기중";

document.getElementById("message").innerHTML=
msg.replace(/\n/g,"<br>");

if(msg!==oldMsg && msg!=="대기중"){

document.body.classList.add("flash");

setTimeout(()=>{
document.body.classList.remove("flash");
},10000);

}

oldMsg=msg;

}
);

async function loadHistory(){

const snap =
await getDocs(collection(db,"history"));

let arr=[];

snap.forEach((d)=>{
if(d.data().message){
arr.push(d.data().message);
}
});

arr = arr.slice(-5).reverse();

document.getElementById("history").innerHTML =
arr.length
? arr.map(x=>"• "+x).join("<br>")
: "최근 알림 없음";

}

loadHistory();
setInterval(loadHistory,5000);

window.teacherCall = async function(){

const reason =
prompt("사유를 입력하세요 (질문, 상담, 급함 등)");

if(!reason) return;

const text =
`📢

선생님 호출 요청

사유 : ${reason}`;

await updateDoc(
doc(db,"call","current"),
{
message:text
}
);

await addDoc(
collection(db,"history"),
{
message:text,
time:new Date().toLocaleString("ko-KR")
}
);

alert("요청이 전송되었습니다.");

};

setInterval(()=>{

document.getElementById("clock").innerText =
new Date().toLocaleTimeString("ko-KR");

},1000);

</script>

</body>
</html>
